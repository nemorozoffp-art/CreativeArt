 renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.1,100);camera.position.set(0,0,5.8);
 const pmrem=new THREE.PMREMGenerator(renderer),room=new RoomEnvironment(),environment=pmrem.fromScene(room,.04);scene.environment=environment.texture;room.dispose();pmrem.dispose();
 scene.add(new THREE.HemisphereLight(0xddeeff,0x17191d,1.4));
 for(const [color,intensity,pos] of [[0xffffff,4,[3,4,4]],[0x89dedc,3,[-4,1,2]],[0xd6f988,3,[1,3,-3]]]){const l=new THREE.DirectionalLight(color,intensity);l.position.set(...pos);scene.add(l)}
 const pivot=new THREE.Group();scene.add(pivot);const loader=new GLTFLoader(),cache=new Map();
 function dispose(root){root.traverse(o=>{o.geometry?.dispose();for(const m of (Array.isArray(o.material)?o.material:[o.material]))if(m){for(const v of Object.values(m))if(v?.isTexture)v.dispose();m.dispose()}})}
 function resize(){const r=canvas.parentElement.getBoundingClientRect();if(r.width&&r.height){renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}}
 const observer=new ResizeObserver(resize);observer.observe(canvas.parentElement);resize();
 async function selectModel(i){selected=i;mark(i);const token=++request;message('modelLoading');try{
  let promise=cache.get(i);if(!promise){promise=loader.loadAsync('assets/models/'+files[i]+'.glb');cache.set(i,promise);promise.catch(()=>cache.delete(i))}const gltf=await promise;if(token!==request)return;
  const root=gltf.scene.clone(true);root.traverse(o=>{if(o.isMesh)o.material=Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone()});
  const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),extent=Math.max(size.x,size.y,size.z);if(!Number.isFinite(extent)||extent<=0)throw Error('Empty GLB');
  root.position.sub(center);const group=new THREE.Group();group.add(root);group.scale.setScalar(2.5/extent);group.userData.base=2.5/extent;
  if(outgoing){pivot.remove(outgoing);outgoing.traverse(o=>{for(const m of (Array.isArray(o.material)?o.material:[o.material]))m?.dispose()})}
  group.userData.file=files[i];outgoing=current;current=group;pivot.add(current);transition=window.creativeAudio.calm()?1:0;
  canvas.classList.add('ready');poster.hidden=true;poster.parentElement.querySelector('.image-note')?.remove();message('modelReady');
 }catch(e){if(token!==request)return;console.warn('Model load failed',files[i],e);message('modelError');canvas.classList.remove('ready');poster.hidden=false;}}
 document.querySelectorAll('[data-model]').forEach(b=>b.addEventListener('click',()=>{selectModel(Number(b.dataset.model));if(b.dataset.gallery){canvas.scrollIntoView({block:'center',behavior:window.creativeAudio.calm()?'auto':'smooth'});canvas.focus({preventScroll:true})}}));
 let yaw=.35,pitch=.1,vx=0,vy=0,drag=null,prev=performance.now();
 canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,time:performance.now()};vx=vy=0;canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const now=performance.now(),dt=Math.max(.008,(now-drag.time)/1000),dx=(e.clientX-drag.x)*.006,dy=(e.clientY-drag.y)*.006;yaw+=dx;pitch=Math.max(-.8,Math.min(.8,pitch+dy));vx=Math.max(-3,Math.min(3,dx/dt));vy=Math.max(-3,Math.min(3,dy/dt));drag={id:e.pointerId,x:e.clientX,y:e.clientY,time:now}});
 for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>{drag=null});
 canvas.addEventListener('keydown',e=>{const k=e.key;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(k))return;e.preventDefault();vx=vy=0;if(k==='Home'){yaw=.35;pitch=.1}else{yaw+=k==='ArrowLeft'?-.15:k==='ArrowRight'?.15:0;pitch=Math.max(-.8,Math.min(.8,pitch+(k==='ArrowUp'?-.15:k==='ArrowDown'?.15:0)))}});
 let visible=true;const intersection=new IntersectionObserver(entries=>visible=entries[0].isIntersecting);intersection.observe(canvas);
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();canvas.classList.remove('ready');poster.hidden=false;message('modelError')});canvas.addEventListener('webglcontextrestored',()=>{canvas.classList.add('ready');poster.hidden=true;message('modelReady')});
 renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-prev)/1000);prev=now;if(document.hidden||!visible)return;const calm=window.creativeAudio.calm();if(!drag&&!calm){yaw+=vx*dt;pitch=Math.max(-.8,Math.min(.8,pitch+vy*dt));vx*=Math.exp(-4*dt);vy*=Math.exp(-4*dt);if(Math.abs(vx)<.01)yaw+=dt*.10}else if(calm){vx=vy=0}pivot.rotation.set(pitch,yaw,0);transition=calm?1:Math.min(1,transition+dt/0.6);const blend=transition*transition*(3-2*transition),energy=calm?0:window.creativeAudio.energy();if(current){current.scale.setScalar(current.userData.base*Math.max(.001,blend)*(1+energy*.06));current.position.x=(1-blend)*.6}if(outgoing){outgoing.scale.setScalar(outgoing.userData.base*Math.max(.001,1-blend));outgoing.position.x=-blend*.6;if(transition===1){pivot.remove(outgoing);outgoing.traverse(o=>{for(const m of (Array.isArray(o.material)?o.material:[o.material]))m?.dispose()});outgoing=null}}renderer.render(scene,camera)});
 await selectModel(0);
 window.addEventListener('pagehide',e=>{if(e.persisted)return;renderer.setAnimationLoop(null);observer.disconnect();intersection.disconnect();environment.dispose();renderer.dispose();for(const p of cache.values())p.then(g=>dispose(g.scene)).catch(()=>{})},{once:true});
}catch(e){console.warn('3D initialization failed',e);renderer?.dispose();message('modelError');canvas.hidden=true;document.querySelectorAll('[data-model]').forEach(b=>b.addEventListener('click',()=>{mark(Number(b.dataset.model));message('modelError')}))}

</script></body></html>
